name: atoztem 자동 게시 (주간 풀)

on:
  schedule:
    # 시각은 UTC. KST = UTC+9. 슬롯 기준 게시라 지연돼도 밀린 슬롯을 따라잡음.
    - cron: '0 23 * * 0-4' # 평일 오전 08:00 KST (월~금) — 오전 릴스 / 월요일엔 풀 생성
    - cron: '0 10 * * 1-5' # 평일 저녁 19:00 KST (월~금) — 저녁 릴스
    - cron: '0 11 * * 5'   # 금요일 20:00 KST — 캐러셀(5개)
    - cron: '0 3 * * 1-5'  # 평일 12:00 KST — 누락 따라잡기(안전망)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '게시하지 않고 생성만 (1=예)'
        required: false
        default: '0'
      force:
        description: '지금 바로 다음 릴스 1개 올리기 (예정시각 무시, 1=예)'
        required: false
        default: '0'
      reel_style:
        description: '릴스 방식 (motion=모션덱 기본 / legacy=구버전 정지카드)'
        required: false
        default: 'motion'
        type: choice
        options: ['motion', 'legacy']

permissions:
  contents: write

concurrency:
  group: atoztem-pipeline
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm ci

      # 컬러 이모지 폰트가 없으면 👉🛒✨ 가 흑백 외곽선으로 렌더된다(실제로 그랬음).
      - name: 한글·이모지 폰트 설치 (카드 렌더링용)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji

      # ── 1단계: 풀 확보 + 밀린 슬롯 렌더 → published/queue.json ──
      - name: 생성 (풀/릴스/캐러셀)
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_NEXT: ${{ github.event.inputs.force || '0' }}
          # 모션덱 릴스가 문제를 일으키면 수동 실행 시 legacy 를 골라 즉시 되돌린다.
          REEL_STYLE: ${{ github.event.inputs.reel_style || 'motion' }}
          # 이 단계의 notify() 가 스토리 링크 알림을 보낸다 — "게시" 단계에만 넘겨주고
          # 여기 빠뜨려서 스토리 알림이 조용히 안 나갔던 적이 있음(2026-08-17).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run pipeline:generate

      # 생성물(카드/영상/풀/링크페이지)을 커밋 → raw URL 로 공개
      - name: 생성물 커밋 & 푸시
        run: |
          git config user.name "atoztem-bot"
          git config user.email "bot@atoztem.local"
          git add published/ docs/ data/
          git commit -m "gen: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "변경 없음"
          git push

      # ── 2단계: 큐 게시 ──
      - name: 게시
        if: ${{ github.event.inputs.dry_run != '1' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/published/cards
        run: npm run pipeline:publish

      # 게시 상태(풀/로그) 갱신분 커밋
      - name: 상태 커밋 & 푸시
        if: ${{ github.event.inputs.dry_run != '1' }}
        run: |
          git config user.name "atoztem-bot"
          git config user.email "bot@atoztem.local"
          git add data/
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "변경 없음"
          git push
